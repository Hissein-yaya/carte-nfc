<title>Hissein — Me contacter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1A26;
    --navy-2:#132436;
    --gold:#C99A44;
    --gold-soft:#E4C583;
    --teal:#2E7D80;
    --sand:#EFE9DC;
    --sand-dim:#a9a28f;
    --line: rgba(239,233,220,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--navy);
    color:var(--sand);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:400px;
  }
  .avatar-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
  }
  .avatar{
    width:104px; height:104px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--gold-soft);
    box-shadow:0 0 0 6px rgba(201,154,68,0.08);
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-soft);
    display:flex; align-items:center; gap:9px;
    margin-bottom:20px;
    justify-content:center;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 4px rgba(46,125,128,0.25);
  }
  h1{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:38px;
    text-align:center;
    color:var(--sand);
  }
  p.sub{
    text-align:center;
    font-family:'Lora', serif;
    font-style:italic;
    font-weight:500;
    color:var(--gold);
    font-size:16px;
    margin-top:6px;
    margin-bottom:38px;
  }
  .links{ display:flex; flex-direction:column; gap:12px; }
  .linkbtn{
    display:flex; align-items:center; gap:16px;
    padding:16px 18px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--navy-2);
    text-decoration:none;
    color:var(--sand);
    transition: border-color .18s ease, transform .15s ease, background .18s ease;
  }
  .linkbtn:active{ transform:scale(0.98); }
  .linkbtn:hover{ border-color:var(--gold-soft); background:#17293c; }
  .icon{
    width:42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-size:19px;
    font-weight:600;
  }
  .icon.wa{ background:#25D366; color:#0E1A26; }
  .icon.tg{ background:#29A9EA; color:#0E1A26; }
  .icon.sc{ background:#FFFC00; color:#0E1A26; }
  .icon.fb{ background:#1877F2; color:#FFFFFF; }
  .txt .t{ font-size:15.5px; font-weight:500; }
  .txt .s{ font-size:12.5px; color:var(--sand-dim); margin-top:2px; }
  .arrow{ margin-left:auto; color:var(--sand-dim); font-size:16px; }

  footer{
    text-align:center;
    margin-top:36px;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:var(--sand-dim);
    letter-spacing:0.05em;
  }
</style>
</head>
